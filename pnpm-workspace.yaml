packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - better-sqlite3
  - necord
  - prisma

overrides:
  file-type: '>=21.3.1'
  multer: '>=2.3.0 <3.0.0'
  'undici@<7': '>=6.23.0'
  'undici@^6': '>=6.28.0 <7'
  'undici@^7': '>=7.29.0 <8'
  'undici@^8': '>=8.5.0'
  'jsdom>undici': '^7.29.0'
  tar: '>=7.5.19'
  hono: '>=4.13.5 <5'
  axios: '>=1.18.0'
  follow-redirects: '>=1.16.0'
  '@hono/node-server': '>=1.19.15 <2'
  lodash: '>=4.18.1 <5'
  handlebars: '>=4.7.9'
  '@xmldom/xmldom': '>=0.8.15 <0.9.0'
  path-to-regexp: '>=8.4.0'
  picomatch: '>=4.0.4'
  h3: '>=1.15.11'
  'brace-expansion@<1.1.18': '1.1.18'
  'brace-expansion@>=2.0.0 <2.1.4': '2.1.4'
  smol-toml: '>=1.7.1'
  # Pin to the current Electron major. A stale ceiling here silently overrides
  # the `electron` range in apps/desktop/package.json and re-pins the lockfile
  # (a `<42` ceiling held the app on 41.10.5 while package.json said ^42).
  # Bump this and apps/desktop/package.json together.
  electron: '>=44.3.0 <45'
  # node-abi must know the current Electron major's ABI or `electron-builder
  # install-app-deps` aborts with "Could not detect abi for version 44.x and
  # runtime electron", silently leaving native modules built for the old ABI.
  # Two majors are in the tree: 4.x via @electron/rebuild, 3.x via prebuild-install.
  'node-abi@3': '>=3.96.0 <4'
  'node-abi@4': '>=4.35.0 <5'
  '@nestjs/core': '>=11.1.18 <12'
  # Must track astro's own `vite` range (^8.0.13 as of astro 7). Astro 7 writes
  # `build.rolldownOptions.input`, which only vite 8 (rolldown) reads — a `<8`
  # ceiling here silently pinned vite 7, leaving the SSR input unset and failing
  # `astro build` with "rollupOptions.input should not be an html file".
  'astro>vite': '>=8.0.16 <9'
  '@astrojs/react>vite': '>=8.0.16 <9'
  esbuild: '>=0.28.1'
  defu: '>=6.1.5 <7'
  fast-uri: '>=3.1.6 <4'
  devalue: '>=5.8.1 <6'
  yaml: '>=2.8.3 <3'
  # CVE pins
  shell-quote: '>=1.9.0'
  qs: '>=6.16.0'
  ws: '>=8.21.0'
  'engine.io': '>=6.6.9'
  tmp: '>=0.2.7'
  'form-data': '>=4.0.6'
  'js-yaml@3': '>=3.15.2'
  '@istanbuljs/load-nyc-config>js-yaml': '>=3.15.2 <4'
  'js-yaml@4': '>=4.3.2 <5'
  '@babel/core': '>=7.29.6'
  'brace-expansion@>=5.0.0 <5.0.9': '5.0.9'
  body-parser: '>=2.3.0'
  postcss: '>=8.5.23'
  nanoid: '>=3.3.18 <4'
  'socket.io-parser': '>=4.2.7'
  'app-builder-lib': '>=26.15.0'
  'builder-util-runtime': '>=9.7.0'
  valibot: '>=1.4.2'
  deepmerge-ts: '>=8.0.0 <9'
  svgo: '>=4.1.0'
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
  postcss-selector-parser: '>=7.1.3'
  '@humanfs/node': '>=0.16.8'
  mysql2: '>=3.23.1'
  joi: '>=18.2.8'
